[package]
name = "beckarepo-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native repository scanner and dependency analysis engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.2"
quick-xml = "=0.42.0"
semver = "1"
regex = "1"
walkdir = "2"
tree-sitter = "=0.25.10"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.2"

